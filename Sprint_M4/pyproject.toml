[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "4.0.0"
description = "Учебная CLI-утилита AES-128 с ручными SHA-256 и SHA3-256."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pycryptodome>=3.20,<4",
]

[project.scripts]
cryptocore = "cryptocore.main:main"

[tool.setuptools.packages.find]
where = ["src"]
