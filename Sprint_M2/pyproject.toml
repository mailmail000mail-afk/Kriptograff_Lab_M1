[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "2.0.0"
description = "Учебная CLI-утилита для режимов AES-128 ECB, CBC, CFB, OFB и CTR."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pycryptodome>=3.20,<4",
]

[project.scripts]
cryptocore = "cryptocore.main:main"

[tool.setuptools.packages.find]
where = ["src"]
