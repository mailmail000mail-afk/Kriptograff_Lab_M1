[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocore"
version = "7.0.1"
description = "Учебная CLI-утилита AES, хешей, HMAC, CMAC, AEAD и PBKDF2-HMAC-SHA256."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pycryptodome>=3.20,<4",
]

[project.scripts]
cryptocore = "cryptocore.main:main"

[tool.setuptools.packages.find]
where = ["src"]
